---
title: "Contact Us"
layout: "layouts/page.html"
---

    <h1>{{ title }}</h1>
    If you are currently a patient, please log in and contact us through the patient portal.
    


    
    <div x-data="contactForm()" class="max-w-md mx-auto p-6 mt-12 bg-white rounded-lg shadow-md">
        <!-- Success Message -->
        <div x-show="success" x-transition class="mb-4 p-3 bg-green-100 text-green-700 rounded border border-green-200">
          Thank you! Your message has been sent successfully.
        </div>
      
        <!-- Error Message -->
        <div x-show="error" x-transition class="mb-4 p-3 bg-red-100 text-red-700 rounded border border-red-200" x-text="errorMessage">
        </div>
      
        <!-- Form -->
        <form x-show="!success" @submit.prevent="submitData">
          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="name">Name</label>
            <input type="text" id="name" x-model="formData.name" required
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-gray-900">
          </div>
      
          <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Email</label>
            <input type="email" id="email" x-model="formData.email" required
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-gray-900">
          </div>
      
          <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="message">Message</label>
            <textarea id="message" x-model="formData.message" rows="4" required
              class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white text-gray-900"></textarea>
          </div>
      
          <button type="submit" :disabled="loading"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg focus:outline-none focus:shadow-outline disabled:opacity-50 transition duration-150">
            <span x-show="!loading">Send Message</span>
            <span x-show="loading">Sending...</span>
          </button>
        </form>
      </div>
